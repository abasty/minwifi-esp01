; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp01_1m_nodecmu]
platform = espressif8266
board = esp01_1m
framework = arduino
upload_speed = 230400
monitor_speed = 1200
monitor_parity = E
monitor_echo = no
monitor_raw = yes
monitor_eol = CR
board_build.ldscript = eagle.flash.1m128.ld
lib_deps = arduino-libraries/ArduinoHttpClient@^0.6.1
board_build.filesystem = littlefs
board_build.flash_mode = qio
upload_resetmethod = nodemcu
build_flags = -D MINITEL=1 -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH

[env:esp01_1m_OTA]
platform = espressif8266
board = esp01_1m
framework = arduino
board_build.ldscript = eagle.flash.1m128.ld
lib_deps = arduino-libraries/ArduinoHttpClient@^0.6.1
board_build.filesystem = littlefs
; board_build.flash_mode = qio
; upload_resetmethod = nodemcu
upload_protocol = espota
upload_port = 192.168.1.30
build_flags = -D MINITEL=1
; -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH

[env:sonoff]
platform = espressif8266
board = esp01_1m
framework = arduino
upload_speed = 115200
monitor_speed = 1200
monitor_parity = E
monitor_echo = no
monitor_raw = yes
monitor_eol = CR
board_build.ldscript = eagle.flash.1m512.ld
lib_deps = arduino-libraries/ArduinoHttpClient@^0.6.1
board_build.filesystem = littlefs
board_build.flash_mode = dout
build_flags = -D MINITEL=1 -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
